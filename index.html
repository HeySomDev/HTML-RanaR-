<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML অ্যাপ টেস্টার</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #111827; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #1f2937; border-bottom: 1px solid #374151; }
        .title { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #60a5fa; font-size: 16px; }
        .actions { display: flex; gap: 8px; }
        .btn { padding: 8px 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #fff; }
        .btn-file { background: #374151; }
        .btn-delete { background: #ef4444; }
        .btn-run { background: #10b981; }
        .editor-container { flex: 1; padding: 15px; display: flex; }
        textarea { width: 100%; height: 100%; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; padding: 15px; font-size: 14px; resize: none; outline: none; }
        textarea::placeholder { color: #9ca3af; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">
            ⚡ HTML অ্যাপ টেস্টার
        </div>
        <div class="actions">
            <input type="file" id="fileInput" accept=".html,.htm" style="display: none;">
            <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">📁 ফাইল দিন</button>
            <button class="btn btn-delete" onclick="clearCode()">🗑️ মুছুন</button>
            <button class="btn btn-run" onclick="runCode()">▶ রান করুন</button>
        </div>
    </div>

    <div class="editor-container">
        <textarea id="codeArea" placeholder="আপনার সম্পূর্ণ HTML কোড এখানে পেস্ট করুন অথবা উপরে ফাইল দিন বাটনে ক্লিক করে ফাইল আপলোড করুন..."></textarea>
    </div>

    <script>
        const codeArea = document.getElementById('codeArea');
        const fileInput = document.getElementById('fileInput');

        // LocalStorage থেকে আগের কোড লোড করা
        window.onload = () => {
            const saved = localStorage.getItem('saved_html_code');
            if (saved) codeArea.value = saved;
        };

        // টাইপ করার সময় অটো সেভ হওয়া
        codeArea.addEventListener('input', () => {
            localStorage.setItem('saved_html_code', codeArea.value);
        });

        // কোড মুছে ফেলা
        function clearCode() {
            if(confirm('কোড মুছে ফেলতে চান?')) {
                codeArea.value = '';
                localStorage.removeItem('saved_html_code');
            }
        }

        // ফাইল আপলোড হ্যান্ডলার
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    codeArea.value = e.target.result;
                    localStorage.setItem('saved_html_code', codeArea.value);
                };
                reader.readAsText(file);
            }
        });

        // কোড রান করা (ফুল স্ক্রিন পেজে নিয়ে যাওয়া)
        function runCode() {
            const code = codeArea.value.trim();
            if (!code) {
                alert('দয়া করে কিছু HTML কোড লিখুন বা পেস্ট করুন!');
                return;
            }
            localStorage.setItem('run_html_code', code);
            window.location.href = 'runner.html';
        }

        // Service Worker রেজিস্ট্রেশন
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
