<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: auto; background: #000; }
    </style>
</head>
<body>
    <script>
        const code = localStorage.getItem('run_html_code');
        if (code) {
            document.open();
            document.write(code);
            document.close();
        } else {
            document.write('<div style="color:white; text-align:center; padding-top:50px; font-family:sans-serif;">কোনো কোড পাওয়া যায়নি! অ্যাপটি পুনরায় চালু করুন।</div>');
        }
    </script>
</body>
</html>
